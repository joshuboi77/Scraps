[package]
name = "scraps-vm"
version = "0.1.0"
edition = "2024"

[dependencies]
ureq = { version = "2", default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
urlencoding = "2"
tungstenite = { version = "0.20", features = ["native-tls"] }
url = "2"
native-tls = "0.2"
libc = "0.2"
unicode-width = "0.1"
